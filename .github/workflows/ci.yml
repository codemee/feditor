# 跨平台建置與測試。尚未在 GitHub 上實際跑過；Linux 需要的系統套件可能要依環境調整。
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux 系統套件（eframe、rfd、字型掃描）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libfontconfig1-dev
      - name: 測試
        run: cargo test --workspace
      # 發布前先確認 macOS 的 .app 打得出來（Info.plist、圖示、簽章），免得到打標籤才發現壞掉
      - name: macOS：建置並打包 FEditor.app
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p feditor
          bash packaging/macos/make-app.sh target/release/feditor 0.0.0-ci dist
          test -x dist/FEditor.app/Contents/MacOS/feditor
          test -f dist/FEditor.app/Contents/Resources/FEditor.icns
          plutil -lint dist/FEditor.app/Contents/Info.plist
          codesign --verify --deep --strict dist/FEditor.app
