# FEditor 自訂配色檔範例。放進設定資料夾的 themes 資料夾（Windows：%APPDATA%\feditor\themes\），
# 打開設定面板時會重新讀取，在「深色配色」（或「淺色配色」）的清單裡選它。
# Example custom color scheme. Put it in the "themes" folder of the config directory; it is re-read whenever
# the settings panel opens, and shows up in the "Dark" (or "Light") scheme list.
name = Midnight
mode = dark
# 沒寫到的顏色從 base 指定的現成配色繼承（可以是內建配色，也可以是別的自訂配色）
base = Tokyo Night
editor_bg = #0D1117
panel_bg = #161B22
syn_keyword = #FF7B72
syn_string = #A5D6FF
syn_function = #D2A8FF
