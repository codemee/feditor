# FEditor 自訂語言檔範例。放進設定資料夾的 syntax 資料夾（Windows：%APPDATA%\feditor\syntax\），重新啟動後生效。
# Example custom language file for FEditor. Put it in the "syntax" folder of the config directory, then restart.
name = PHP
extensions = php, phtml
line_comment = //, #
block_comment = /*, */
quotes = ", '
capital_types = true
keywords = abstract and array as break case catch class clone const continue declare default
keywords = do echo else elseif empty extends false final finally for foreach function global
keywords = if implements include include_once instanceof interface isset namespace new null
keywords = or private protected public require require_once return static switch this throw
keywords = trait true try unset use var while yield
