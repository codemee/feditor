[package]
name = "feditor"
version.workspace = true
edition.workspace = true

[dependencies]
alacritty_terminal = "0.26.0"
polling = "3"
csv = "1.4.0"
eframe = "0.37.0"
egui_extras = { version = "0.37", features = ["svg", "image"] }
encoding_rs = "0.8.44"
feditor-core = { version = "0.13.7", path = "../core" }
feditor-script = { version = "0.13.7", path = "../script" }
feditor-script-js = { version = "0.13.7", path = "../script-js" }
fontique = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
notify = "8"
pulldown-cmark = { version = "0.13.6", default-features = false }
rfd = "0.17.2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34"
skrifa = "0.44.0"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
# 工作列的跳躍清單（ICustomDestinationList）要用 COM；windows-sys 沒有 COM 介面的包裝
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURL"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
